version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kingofthecord-app
    restart: unless-stopped

    # Traefik connects internally — do NOT publish ports
    expose:
      - "7777"

    environment:
      # Runtime
      PORT: "7777"
      NODE_ENV: "production"
      BUN_ENV: "production"

      # MongoDB
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: "kingofthecord"

      # Upload service (unchanged)
      UPLOAD_SERVICE_URL: "0.0.0.0:7776"

      # SvelteKit
      BODY_SIZE_LIMIT: "Infinity"

      # IMPORTANT: must match public URL behind Traefik
      ORIGIN: "https://kingofthecord.connorcampbell.dev"
      PUBLIC_ORIGIN: "https://kingofthecord.connorcampbell.dev"

    labels:
      - traefik.enable=true

      # Router
      - traefik.http.routers.kotc.rule=Host(`kingofthecord.connorcampbell.dev`)
      - traefik.http.routers.kotc.entrypoints=web
      - traefik.http.routers.kotc.tls=true

      # Explicit middleware override (fixes 403 POST + uploads)
      - traefik.http.routers.kotc.middlewares=redirect-to-https@file,upload-limit@file

      # Service
      - traefik.http.services.kotc.loadbalancer.server.port=7777
