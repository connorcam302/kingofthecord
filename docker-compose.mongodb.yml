services:
  mongodb:
    image: mongo:7
    container_name: kingofthecord-mongodb
    restart: unless-stopped
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongodb_data:/data/db
      - ./data/dumps:/dumps:ro
      - ./scripts/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    environment:
      - MONGO_INITDB_DATABASE=${MONGODB_DB:-kingofthecord}
    command: >
      bash -c "
        chmod +x /docker-entrypoint-initdb.d/mongo-init.sh &&
        docker-entrypoint.sh mongod --bind_ip 0.0.0.0
      "

volumes:
  mongodb_data:
